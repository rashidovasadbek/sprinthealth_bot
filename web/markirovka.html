<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markirovka navbati</title>
<style>
  :root {
    --bg: #f4f6f5; --card: #ffffff; --ink: #17201c; --muted: #66736d;
    --line: #dfe5e2; --accent: #0f766e; --accent-ink: #ffffff;
    --soft: #e6f2f0; --new: #b45309; --new-bg: #fff4e0; --done: #15803d;
    --done-bg: #e8f6ec; --err: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101513; --card: #18201d; --ink: #e6ece9; --muted: #93a19b;
      --line: #2a3531; --accent: #2dd4bf; --accent-ink: #062b27;
      --soft: #17312d; --new: #fbbf24; --new-bg: #3a2c0c; --done: #4ade80;
      --done-bg: #12301d; --err: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--card);
           border-bottom: 1px solid var(--line); }
  .bar { max-width: 1100px; margin: 0 auto; padding: 12px 16px;
         display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  .grow { flex: 1; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
           background: var(--card); color: var(--ink); padding: 8px 14px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
                   font-weight: 600; padding: 10px 18px; }
  button:disabled { opacity: .6; cursor: wait; }
  input[type=search], input[type=text], input[type=password] {
    font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); min-width: 0; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  .stat b { display: block; font-size: 22px; }
  .stat span { color: var(--muted); font-size: 13px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .tabs button.on { background: var(--soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
  .card.done { border-color: var(--done); }
  .card.isnew { border-color: var(--new); }
  .ch { padding: 12px 14px; display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; border-bottom: 1px solid var(--line); }
  .ch .ph { font-weight: 700; font-size: 16px; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--soft); color: var(--accent); white-space: nowrap; }
  .tag.new { background: var(--new-bg); color: var(--new); font-weight: 700; }
  .tag.done { background: var(--done-bg); color: var(--done); font-weight: 700; }
  .meta { color: var(--muted); font-size: 13px; padding: 8px 14px 0; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); font-weight: 600; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  th.n { text-align: right; }
  tr:last-child td { border-bottom: 0; }
  tr.ok td { color: var(--muted); text-decoration: line-through; }
  tr.ok td.cb { text-decoration: none; }
  td.cb { width: 44px; }
  input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--done); cursor: pointer; }
  .box { color: var(--muted); font-size: 12px; display: block; }
  .empty, .msg { text-align: center; color: var(--muted); padding: 40px 10px; }
  .msg.err { color: var(--err); }
  .login { max-width: 420px; margin: 40px auto; background: var(--card); border: 1px solid var(--line);
           border-radius: 12px; padding: 20px; display: grid; gap: 10px; }
  .login label { font-size: 13px; color: var(--muted); }
  .wrap { overflow-x: auto; }
  @media (max-width: 600px) { th, td { padding: 7px 10px; } .hide-sm { display: none; } }
  @media print {
    header .bar > :not(h1):not(.sub), .tabs, .stats, input[type=checkbox] { display: none !important; }
    header { position: static; } body { background: #fff; color: #000; }
    .card { break-inside: avoid; border-color: #999; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div>
      <h1>📦 Markirovka navbati</h1>
      <div class="sub" id="sub">Oplataga hali yuborilmagan bronlar</div>
    </div>
    <div class="grow"></div>
    <input type="search" id="q" placeholder="Apteka, INN, shartnoma, dori…" style="width:240px">
    <button class="primary" id="load">⟳ Bronlarni yuklash</button>
  </div>
</header>

<main id="main">
  <div class="msg">«Bronlarni yuklash» tugmasini bosing.</div>
</main>

<script>
(() => {
  // ---------- sozlamalar (brauzerda saqlanadi) ----------
  const LS = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const url = new URL(location.href);
  if (url.searchParams.get("token")) {            // birinchi kirish: ?token=... → saqlab, URL'dan olib tashlaymiz
    LS.set("mk_token", url.searchParams.get("token"));
    url.searchParams.delete("token");
    history.replaceState(null, "", url);
  }
  // Sahifa serverdan ochilsa API shu yerda; fayldan (file://) ochilsa server manzili so'raladi.
  const sameOrigin = location.protocol.startsWith("http");
  const apiBase = () => sameOrigin ? "" : (LS.get("mk_server", "") || "").replace(/\/+$/, "");

  const $ = (s) => document.querySelector(s);
  const main = $("#main"), btn = $("#load"), q = $("#q");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const num = (n) => Number(n || 0).toLocaleString("ru-RU");
  const fmtDate = (iso) => { const d = new Date(iso);
    return d.toLocaleDateString("ru-RU") + " " + d.toLocaleTimeString("ru-RU", {hour: "2-digit", minute: "2-digit"}); };

  let data = null, tab = LS.get("mk_tab", "brons");
  let checks = LS.get("mk_checks", {});           // {"bronId:lineNo": true}
  let seen = LS.get("mk_seen", null);             // oldingi yuklashdagi bron ID'lari

  function boxes(qty, cap) {
    if (!cap) return "";
    const full = Math.floor(qty / cap), rest = qty % cap;
    const parts = [];
    if (full) parts.push(`${full} karobka`);
    if (rest) parts.push(`${rest} dona ochiq`);
    return `<span class="box">${parts.join(" + ")} (×${cap})</span>`;
  }

  function login(errText) {
    main.innerHTML = `
      <form class="login" id="lf">
        <b>Kirish</b>
        ${sameOrigin ? "" : `<label>Server manzili</label>
          <input type="text" id="srv" placeholder="http://193.180.209.245:8090" value="${esc(LS.get("mk_server",""))}" required>`}
        <label>Token (WEB_TOKEN)</label>
        <input type="password" id="tok" value="${esc(LS.get("mk_token",""))}" required>
        ${errText ? `<div class="msg err" style="padding:4px">${esc(errText)}</div>` : ""}
        <button class="primary">Saqlash va yuklash</button>
      </form>`;
    $("#lf").onsubmit = (e) => {
      e.preventDefault();
      if (!sameOrigin) LS.set("mk_server", $("#srv").value.trim());
      LS.set("mk_token", $("#tok").value.trim());
      load();
    };
  }

  async function load() {
    const token = LS.get("mk_token", "");
    if (!token || (!sameOrigin && !apiBase())) return login();
    btn.disabled = true; btn.textContent = "Yuklanmoqda…";
    try {
      const r = await fetch(apiBase() + "/api/pending", { headers: { "X-Token": token }, cache: "no-store" });
      if (r.status === 401) return login("Token noto'g'ri.");
      if (!r.ok) throw new Error("Server javobi: " + r.status);
      data = await r.json();

      // yangi kelganlarni belgilash (oldingi yuklashda yo'q bo'lganlar)
      const ids = data.brons.map(b => b.id);
      const prev = new Set(seen || ids);
      data.brons.forEach(b => b._new = !prev.has(b.id));
      seen = ids; LS.set("mk_seen", ids);

      // oplataga ketgan bronlarning belgilarini tozalash
      const alive = new Set(ids.map(String));
      for (const k of Object.keys(checks)) if (!alive.has(k.split(":")[0])) delete checks[k];
      LS.set("mk_checks", checks);

      $("#sub").textContent = `${data.company} · yangilandi ${fmtDate(data.generated_at)}`;
      render();
    } catch (e) {
      main.innerHTML = `<div class="msg err">❌ Yuklab bo'lmadi: ${esc(e.message)}<br><br>
        Server ishlayaptimi va manzil to'g'rimi? <button id="chg">Sozlamani o'zgartirish</button></div>`;
      $("#chg").onclick = () => login();
    } finally {
      btn.disabled = false; btn.textContent = "⟳ Bronlarni yuklash";
    }
  }

  function matches(b, term) {
    if (!term) return true;
    const hay = [b.pharmacy_name, b.inn, b.doc_contract_no, b.region_name, b.manager_name, b.id,
                 ...b.items.map(i => i.name)].join(" ").toLowerCase();
    return term.split(/\s+/).every(t => hay.includes(t));
  }

  function render() {
    if (!data) return;
    const term = q.value.trim().toLowerCase();
    const brons = data.brons.filter(b => matches(b, term));
    const lines = brons.reduce((s, b) => s + b.items.length, 0);
    const doneLines = brons.reduce((s, b) => s + b.items.filter(i => checks[`${b.id}:${i.line_no}`]).length, 0);
    const units = brons.reduce((s, b) => s + b.items.reduce((t, i) => t + i.quantity, 0), 0);
    const newCount = brons.filter(b => b._new).length;

    let html = `
      <div class="stats">
        <div class="stat"><b>${brons.length}</b><span>bron navbatda</span></div>
        <div class="stat"><b>${num(units)}</b><span>dona jami</span></div>
        <div class="stat"><b>${doneLines} / ${lines}</b><span>qator markirovkasi olindi</span></div>
        <div class="stat"><b>${newCount}</b><span>oxirgi yuklashdan beri yangi</span></div>
      </div>
      <div class="tabs">
        <button data-tab="brons" class="${tab === "brons" ? "on" : ""}">Bronlar bo'yicha</button>
        <button data-tab="drugs" class="${tab === "drugs" ? "on" : ""}">Preparatlar bo'yicha (jami)</button>
        <button onclick="window.print()">🖨 Chop etish</button>
      </div>`;

    if (!brons.length) {
      html += `<div class="card empty">${data.brons.length ? "Qidiruv bo'yicha hech narsa topilmadi." : "✅ Navbatda bron yo'q — hammasi oplataga yuborilgan."}</div>`;
    } else if (tab === "drugs") {
      html += renderDrugs(brons);
    } else {
      html += brons.map(renderBron).join("");
    }
    main.innerHTML = html;
  }

  function renderBron(b) {
    const total = b.items.length;
    const done = b.items.filter(i => checks[`${b.id}:${i.line_no}`]).length;
    const all = total && done === total;
    const rows = b.items.map(i => {
      const k = `${b.id}:${i.line_no}`, ok = !!checks[k];
      return `<tr class="${ok ? "ok" : ""}">
        <td class="cb"><input type="checkbox" data-k="${k}" ${ok ? "checked" : ""} title="Markirovkasi olindi"></td>
        <td>${esc(i.name)}</td>
        <td class="n"><b>${num(i.quantity)}</b> ${esc(i.unit)}${boxes(i.quantity, i.box_capacity)}</td>
      </tr>`;
    }).join("");
    return `
      <div class="card ${all ? "done" : ""} ${b._new ? "isnew" : ""}">
        <div class="ch">
          <span class="ph">${esc(b.pharmacy_name)}</span>
          <span class="tag">Shartnoma ${esc(b.doc_contract_no)}</span>
          <span class="tag">Bron #${b.id}</span>
          ${b._new ? `<span class="tag new">YANGI</span>` : ""}
          ${all ? `<span class="tag done">✓ Markirovka tayyor</span>` : `<span class="tag">${done}/${total}</span>`}
        </div>
        <div class="meta">INN ${esc(b.inn)} · 📍 ${esc(b.region_name)} · 👤 ${esc(b.manager_name || "—")} · 🕒 ${fmtDate(b.created_at)} · ${num(b.total_sum)} so'm</div>
        <div class="wrap"><table>
          <thead><tr><th></th><th>Preparat</th><th class="n">Soni</th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>
      </div>`;
  }

  function renderDrugs(brons) {
    const map = new Map();
    for (const b of brons) for (const i of b.items) {
      const key = i.drug_id ?? i.name;
      const m = map.get(key) || { name: i.name, unit: i.unit, cap: i.box_capacity, qty: 0, left: 0, list: [] };
      m.qty += i.quantity;
      if (!checks[`${b.id}:${i.line_no}`]) m.left += i.quantity;
      m.list.push(`${b.pharmacy_name} — ${i.quantity}`);
      map.set(key, m);
    }
    const rows = [...map.values()].sort((a, b) => a.name.localeCompare(b.name)).map(m => `
      <tr class="${m.left === 0 ? "ok" : ""}">
        <td>${esc(m.name)}<span class="box hide-sm">${esc(m.list.join(" · "))}</span></td>
        <td class="n"><b>${num(m.qty)}</b> ${esc(m.unit)}${boxes(m.qty, m.cap)}</td>
        <td class="n">${m.left ? num(m.left) : "✓"}</td>
        <td class="n hide-sm">${m.list.length}</td>
      </tr>`).join("");
    return `<div class="card"><div class="wrap"><table>
      <thead><tr><th>Preparat</th><th class="n">Jami kerak</th><th class="n">Qoldi</th><th class="n hide-sm">Bronlar</th></tr></thead>
      <tbody>${rows}</tbody></table></div></div>`;
  }

  // ---------- hodisalar ----------
  btn.onclick = load;
  q.oninput = render;
  main.addEventListener("click", (e) => {
    const t = e.target.closest("[data-tab]");
    if (t) { tab = t.dataset.tab; LS.set("mk_tab", tab); render(); }
  });
  main.addEventListener("change", (e) => {
    const k = e.target.dataset?.k;
    if (!k) return;
    if (e.target.checked) checks[k] = true; else delete checks[k];
    LS.set("mk_checks", checks);
    render();
  });

  load();   // ochilganda bir marta o'zi yuklaydi
})();
</script>
</body>
</html>
